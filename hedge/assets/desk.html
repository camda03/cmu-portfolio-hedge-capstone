<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Portfolio hedge desk · CMU Capstone</title>
    <style>@@STYLE@@</style>
  </head>
  <body>
    <dialog id="gdelt-dialog"><div class="row"><h2>GDELT research</h2><button onclick="this.closest('dialog').close()">Close</button></div><iframe title="Full GDELT research dashboard" sandbox="allow-scripts allow-downloads"></iframe></dialog>
    <a class="skip" href="#view" onclick="document.querySelector('#view').focus(); return false;">Skip to content</a>
    <div class="shell">
      <aside>
        <a href="#overview" class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>Hedge Desk<small>CMU Capstone</small></span></a>
        <nav aria-label="Portfolio workspace"></nav>
        <footer>Portfolio research<br>CMU Agentic AI</footer>
      </aside>
      <main>
        <div class="top"><div class="top-left"><span id="mode" class="mode"></span></div><div class="top-right"><span id="asof"></span><a id="worker-files" class="textlink" hidden target="_blank" rel="noreferrer">Worker sessions</a></div></div>
        <article id="view" tabindex="-1"></article>
      </main>
    </div>
    <dialog id="mapdialog">
      <div class="row">
        <h2>System map</h2>
        <button onclick="this.closest('dialog').close()">Close</button>
      </div>
      <div class="scroll"><img class="map" alt="Full system architecture" id="largeMap" /></div>
    </dialog>
    <script id="run" type="application/json">
      @@RUN@@
    </script>
    <script>
      "use strict";
      const d = JSON.parse(document.querySelector("#run").textContent),
        g = d.gdelt,
        a = d.analysts,
        m = d.decision,
        b = d.tracker.current,
        t = d.table;
      const sample = m.mode === "Scripted rehearsal",
        closing = d.market.price_mode === "last_close_rehearsal",
        control = m.mode === "Scripted close rehearsal",
        mapSrc = "data:image/svg+xml;base64,@@MAP@@";
      const v = document.querySelector("#view"),
        navGroups = {
          Portfolio: {overview:"Overview",hedge:"Hedge decision",portfolio:"Paper portfolio", journal:"Decision journal"},
          Research: {analysts:"Equity and Index Research Team",gdelt:"GDELT analogs"},
          System: {freshness:"Source freshness",map:"System map"},
        };
      let stock = a.find((s) => s.symbol === "AAPL").symbol,
        day = g?.dates[0]?.day,
        group = "year",
        receiptData = null,
        inspected = null,
        inspectSymbol = "AAPL",
        packetError = "";
      // In displayed research, address assignments to the portfolio manager. Keep the signed report intact.
      function reportText(value) {
        const name = d.report_contact;
        if (!name || !/^[a-z]+$/i.test(name)) return value;
        return String(value ?? "")
          .replace(new RegExp("\\b([Ff]or|[Tt]o|[Aa]sk|[Bb]y) " + name + "\\b(?!\\s+[A-Z])", "g"), "$1 the portfolio manager")
          .replace(new RegExp("\\b" + name + "(?=[’']s\\b|\\*{0,2}\\s*[:,;/])", "g"), "Portfolio manager");
      }
      const esc = (x) =>
        String(x ?? "—").replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      const num = (n, k = 0) =>
        Number(n).toLocaleString("en-US", { maximumFractionDigits: k, minimumFractionDigits: k });
      const money = (n, k = 0) =>
        n == null
          ? "—"
          : Number(n).toLocaleString("en-US", {
              style: "currency",
              currency: "USD",
              maximumFractionDigits: k,
              minimumFractionDigits: k,
            });
      const pct = (n) => (n == null ? "—" : (n > 0 ? "+" : "") + num(100 * n, 2) + "%");
      const signed = (n) => (n > 0 ? "+" + n : String(n));
      const et = (s) =>
        s == null
          ? "—"
          : new Intl.DateTimeFormat("en-US", {
              timeZone: "America/New_York",
              month: "short",
              day: "numeric",
              year: "numeric",
              hour: "numeric",
              minute: "2-digit",
              timeZoneName: "short",
            }).format(new Date(s));
      const shortTime = (s) =>
        new Intl.DateTimeFormat("en-US", {
          timeZone: "America/New_York",
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",
        }).format(new Date(s));
      const panel = (s, cls = "") => '<section class="panel ' + cls + '">' + s + "</section>";
      const title = (h, p) => "<h1>" + esc(h) + '</h1><p class="intro">' + esc(p) + "</p>";
      const stat = (k, n, h) =>
        '<div class="stat"><label>' +
        esc(k) +
        "</label><strong>" +
        esc(n) +
        "</strong><span>" +
        esc(h) +
        "</span></div>";
      const stats = (...rows) => '<div class="stats">' + rows.map((r) => stat(...r)).join("") + "</div>";
      const table = (heads, rows) =>
        '<div class="scroll"><table><thead><tr>' +
        heads.map((s) => "<th>" + esc(s) + "</th>").join("") +
        "</tr></thead><tbody>" +
        rows.map((row) => "<tr>" + row.map((c) => "<td>" + esc(c) + "</td>").join("") + "</tr>").join("") +
        "</tbody></table></div>";
      const external = (url, label) => {
        try {
          if (!url) return "";
          let u = new URL(url, location.href);
          if (!["https:", "http:"].includes(u.protocol)) return "";
          return (
            '<a class="button" target="_blank" rel="noreferrer" href="' +
            esc(u.href) +
            '">' +
            esc(label) +
            "</a>"
          );
        } catch {
          return "";
        }
      };
      const details = (name, content) =>
        "<details><summary>" + esc(name) + "</summary>" + content + "</details>";
      const memo = (name, text) =>
        '<div class="memo"><h3>' + esc(name) + '</h3><p class="measure">' + esc(text) + "</p></div>";
      const keep = m.current_contracts,
        target = m.target_contracts,
        delta = m.change_contracts,
        hist = d.tracker.points;
      function chart(lines, labels, formatter, ylabel, times=null) {
        const W = 700,
          H = 230,
          L = 83,
          R = 24,
          T = 16,
          B = 37,
          colors = ["#4d68c8", "#8998ab"];
        let vals = lines
          .flat()
          .filter((x) => x != null && Number.isFinite(+x))
          .map(Number);
        if (!vals.length) return '<p class="empty">No path values supplied.</p>';
        let lo = Math.min(...vals),
          hi = Math.max(...vals);
        if (lo === hi) {
          let p = Math.abs(lo) * 0.002 || 0.01;
          lo -= p;
          hi += p;
        } else {
          let p = (hi - lo) * 0.09;
          lo -= p;
          hi += p;
        }
        const elapsed = times && times.at(-1) - times[0],
          X = (i) => L + (W-L-R) * (elapsed > 0 ? (times[i]-times[0])/elapsed : i/Math.max(1, labels.length-1)),
          Y = (n) => T + ((hi - n) * (H - T - B)) / (hi - lo);
        let svg =
          '<svg viewBox="0 0 700 230" role="img" aria-label="' +
          esc(ylabel) +
          '"><title>' +
          esc(ylabel) +
          "</title>";
        for (let i = 0; i <= 4; i++) {
          let n = lo + ((hi - lo) * i) / 4,
            y = Y(n);
          svg +=
            '<path d="M' +
            L +
            " " +
            y +
            "H" +
            (W - R) +
            '" stroke="#dde4df"/><text x="' +
            (L - 7) +
            '" y="' +
            (y + 4) +
            '" text-anchor="end" fill="#455e61" font-size="12">' +
            esc(formatter(n)) +
            "</text>";
        }
        const mid = Math.floor((labels.length-1)/2), last=labels.length-1;
        for (const i of new Set([0, ...(X(mid)-X(0)>100 && X(last)-X(mid)>100 ? [mid] : []), last]))
          svg +=
            '<text text-anchor="' +
            (i === 0 ? "start" : i === labels.length - 1 ? "end" : "middle") +
            '" x="' +
            X(i) +
            '" y="218" fill="#455e61" font-size="12">' +
            esc(labels[i]) +
            "</text>";
        lines.forEach((line, j) => {
          let prev = false,
            path = "";
          line.forEach((p, i) => {
            if (p == null) {
              prev = false;
              return;
            }
            path += (prev ? "L" : "M") + X(i) + " " + Y(p);
            prev = true;
          });
          svg +=
            '<path d="' +
            path +
            '" fill="none" stroke="' +
            colors[j] +
            '" stroke-width="3" ' +
            (j ? 'stroke-dasharray="7 4"' : "") +
            "/>";
          let k = line.findLastIndex((x) => x != null);
          if (k >= 0)
            svg += '<circle cx="' + X(k) + '" cy="' + Y(line[k]) + '" r="3.5" fill="' + colors[j] + '"/>';
        });
        return '<div class="figure">' + svg + "</svg></div>";
      }
      function mapPage() {
        return (
          title(
            "Portfolio hedge system",
            "Follow a trading session from research publication through a signed futures decision and the simulated portfolio record.",
          ) +
          stats(
            [
              "Analyst subjects",
              a.length + " / 7",
              closing ? d.analyst_publication : sample ? "Illustrative daily packet" : "Accepted daily reports",
            ],
            [
              "GDELT cohort",
              g ? num(g.queries) : "Unavailable",
              g
                ? g.synthetic
                  ? "Synthetic retrieval fixture"
                  : "Saved historical study"
                : "Coverage gap recorded",
            ],
            [
              "MES overlay",
              signed(keep) + " → " + signed(target),
              sample || control ? "Scripted paper example" : "Advisory target",
            ],
          ) +
          panel(
            '<div class="row"><h2>System architecture</h2><button id="expand">Enlarge diagram</button></div><img class="map" src="' +
              mapSrc +
              '" alt="The Equity and Index Research Team uses IBKR reference prices. The hedge worker requests its own IBKR marks and combines them with the analyst reports, GDELT analogs and simulated positions.">',
            "mapbox",
          ) +
          (!sample && !control && d.worker_view ? panel('<div class="row"><h2>Worker dashboard</h2>'+external(d.worker_view,"Open latest worker dashboard")+'</div><p class="note">The updated Google worker publishes this private file after each completed review or forward observation. It becomes available with the first dashboard deployment. The worker sessions folder also contains the original dated runs.</p>') : "") +
          '<p class="note">' +
          (closing ? esc("IBKR closing bars for " + d.market.session_date + ". " + d.market.simulation_assumption) : sample
            ? "The GDELT tab identifies its source. The analyst forecasts, prices, decision and subsequent fills in this walkthrough are illustrative."
            : "Each view uses the archived decision-time inputs. The recommendation is separate from the ledger’s fills.") +
          "</p>"
        );
      }
      function analystPage() {
        let s = a.find((x) => x.symbol === stock),
          f = s.forecast,
          mark = s.mark.last,
          ref = f.reference_price;
        return (
          title(
            "Equity and Index Research Team",
            "Four specialists examine each subject. A forecast writer drafts the assessment, a critic challenges it, and a final writer publishes the report.",
          ) +
          panel(
            '<div class="row"><h2>Daily batch</h2>' +
              external(
                d.research_home,
                "Analyst dashboard",
              ) +
              '</div><p class="note">' +
              esc(closing ? d.analyst_publication : sample ? "Synthetic packet" : "Verified packet") +
              " · " +
              esc(d.batch_date) +
              " · " +
              esc(d.analyst_run) +
              (d.research_home ? " · "+external(d.research_home+"/static/verify-daily.html?date="+encodeURIComponent(d.batch_date),"Verify dated publication") : "")+
              '</p><div class="trace"><span>Business</span><span>Valuation</span><span>Catalysts</span><span>Geoeconomics</span> → <span>Draft</span> → <span>Critic</span> → <span>Final report</span></div><p class="note">Sol 6.2 runs the specialists, the draft and the two evidence searches. Astra 6.2 handles critique and final writing.</p>',
          ) +
          panel(
            '<div class="row"><h2>Published assessments</h2><div class="chips">' +
              a
                .map(
                  (x) =>
                    '<button data-stock="' +
                    esc(x.symbol) +
                    '" aria-pressed="' +
                    (x.symbol === stock) +
                    '" class="' +
                    (x.symbol === stock ? "chosen" : "") +
                    '">' +
                    esc(x.symbol) +
                    "</button>",
                )
                .join("") +
              "</div></div>" +
              stats(
                ["Reference", ref == null ? "—" : num(ref, 2), f.price_date || "No dated reference"],
                [
                  "Forecast endpoint",
                  f.status === "abstain" ? "Abstain" : num(f.expected_end_price, 2),
                  f.status === "abstain"
                    ? "Reason stated in report"
                    : pct(f.expected_return) + " over " + (f.horizon_sessions || 20) + " sessions",
                ],
                [
                  closing ? "IBKR close · " + d.market.session_date : "Decision-time mark",
                  num(mark, 2),
                  ref > 0 ? pct(mark / ref - 1) + " from reference" : "No comparable reference",
                ],
              ) +
              '<p class="note">' +
              esc(s.symbol === "SP500" ? "Index points" : "USD per share") +
              " · Cutoff " +
              esc(et(f.information_cutoff)) +
              " · Issued " +
              esc(et(f.issued_at)) +
              " · Horizon " +
              esc(f.horizon_end ?? "unspecified") +
              "</p>" +
              (f.status === "abstain" ? '<p class="notice">' + esc(reportText(f.reason)) + "</p>" : "") +
              '<div class="report">' +
              esc(reportText(s.report)) +
              "</div>" +
              details(
                "Report provenance",
                '<p class="mono">' +
                  esc(f.forecast_id) +
                  "<br>" +
                  esc(s.key) +
                  "<br>SHA-256 " +
                  esc(s.sha) +
                  "</p>",
              ),
          ) +
          panel(
            '<h2>Inspect a producer receipt</h2><p class="note">Open the dated status.json to see the saved progress. For a completed run, add portfolio-research.json to verify the checksum and read the seven final reports. Files are inspected locally. The archived hedge decision keeps its original inputs.</p><input type="file" id="receipt" accept=".json,application/json" aria-label="Open analyst status JSON"><div id="receiptResult" aria-live="polite"></div>',
          )
        );
      }
      function showReceipt() {
        let el = document.querySelector("#receiptResult");
        if (!el || !receiptData) return;
        let r = receiptData;
        if (r.error) {
          el.textContent = r.error;
          return;
        }
        el.innerHTML =
          '<div class="receipt"><strong>' +
          esc(r.session_date) +
          " · " +
          esc(r.status) +
          '</strong><p class="mono">' +
          esc(r.run_id) +
          " · updated " +
          esc(r.updated_at) +
          "</p>" +
          table(
            ["Subject", "Stage", "Detail"],
            Object.entries(r.subjects).map(([k, s]) => [k, s.status, s.detail ?? s.last_stage ?? "—"]),
          ) +
          (r.status === "completed" && r.accepted === 7
            ? '<p><label>Inspect the matching portfolio packet <input type="file" id="realPacket" accept=".json,application/json"></label></p>'
            : "") +
          (packetError ? '<p class="notice">' + esc(packetError) + "</p>" : "") +
          (inspected
            ? '<h3>Verified research packet</h3><p class="mono">' +
              esc(r.packet_sha256) +
              '</p><select id="inspectSymbol" class="selector" aria-label="Inspect verified subject">' +
              Object.keys(inspected.subjects)
                .sort()
                .map((k) => "<option " + (k === inspectSymbol ? "selected" : "") + ">" + esc(k) + "</option>")
                .join("") +
              '</select><p class="note">' +
              esc(inspected.subjects[inspectSymbol].forecast.forecast_id) +
              " · cutoff " +
              esc(et(inspected.subjects[inspectSymbol].forecast.information_cutoff)) +
              '</p><div class="report">' +
              esc(reportText(inspected.subjects[inspectSymbol].report_markdown)) +
              "</div>"
            : "") +
          "</div>";
      }
      async function inspectPacket(file, r) {
        if (!window.crypto?.subtle)
          throw Error("Open this HTML locally in a browser that supports SHA-256 verification.");
        const hash = async (b) =>
          Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", b)), (v) =>
            v.toString(16).padStart(2, "0"),
          ).join("");
        const bytes = await file.arrayBuffer();
        if ((await hash(bytes)) !== r.packet_sha256)
          throw Error("Packet checksum differs from the selected receipt.");
        const p = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(bytes));
        const keys = Object.keys(p.subjects).sort();
        if (
          p.run_id !== r.run_id ||
          p.fleet.test_id !== r.run_id ||
          p.session_date !== r.session_date ||
          p.source_revision !== r.source_revision ||
          p.schema !== "portfolio-research-v1" ||
          p.all_reports_available !== true ||
          p.hourly_monitoring !== false ||
          p.execute !== false ||
          r.packet_key !== "portfolio-research/" + p.run_id + ".json" ||
          keys.join() !==
            a
              .map((x) => x.symbol)
              .sort()
              .join()
        )
          throw Error("The packet does not match this seven-subject batch.");
        for (const k of keys) {
          const item = p.subjects[k];
          if (
            item.symbol !== k ||
            item.forecast.symbol !== k ||
            item.status !== "available" ||
            !item.forecast.forecast_id ||
            !item.report_markdown?.trim() ||
            (await hash(new TextEncoder().encode(item.report_markdown))) !== item.report_sha256
          )
            throw Error("Report verification failed for " + k);
        }
        return p;
      }
      function gdeltPage() {
        if (!g)
          return (
            title("GDELT historical analogs", "Historical research was unavailable for this decision.") +
            panel("<h2>Coverage gap</h2><p>" + esc(d.gdelt_gap) + "</p>")
          );
        let row = g.dates.find((r) => r.day === day) || g.dates[0];
        let counts = {};
        for (let r of g.dates) {
          let k = r.day.slice(0, group === "year" ? 4 : group === "month" ? 7 : 10);
          counts[k] = (counts[k] || 0) + r.votes;
        }
        let sorted = Object.entries(counts)
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
          .slice(0, 8);
        let picker =
          '<select id="datepick" class="selector widepick" aria-label="Historical match date">' +
          g.dates
            .map(
              (r) =>
                '<option value="' +
                esc(r.day) +
                '" ' +
                (r.day === day ? "selected" : "") +
                ">" +
                esc(r.day) +
                " · " +
                num(r.votes, 2) +
                " votes" +
                (r.note ? " · reader reviewed" : "") +
                "</option>",
            )
            .join("") +
          "</select>";
        return (
          title("GDELT historical analogs", g.assessment) +
          (warnings.some(row=>row.group==="GDELT")?freshnessBanner():"") +
          stats(
            ["Selected stories", num(g.queries), g.synthetic ? "Synthetic cohort" : "Saved one-hour cohort"],
            ["Historical corpus", num(g.corpus), "Filtered news documents"],
            ["Matched dates", num(g.dates.length), num(g.weight) + " total votes"],
          ) +
          '<p class="note">' +
          (g.synthetic ? "Synthetic study" : "Archived GDELT study") +
          " · " +
          esc(et(g.window.start)) +
          " to " +
          esc(et(g.window.end)) +
          " · " +
          esc(g.run) +
          "</p>" +
          panel(
            '<div class="row"><h2>Historical S&P 500 return paths</h2>' +
              picker +
              '</div><p class="note">Change the date to compare its path with the vote-weighted mean. T0 is the market anchor close.</p>' +
              '<div class="swatches"><span>Selected date</span><span class="blue">Weighted mean</span></div>' +
              chart(
                [row.path, g.mean],
                g.mean.map((_, i) => "T" + i),
                pct,
                "Historical cumulative price return",
              ) +
              '<p class="note">Anchor ' +
              esc(row.anchor) +
              " · T20 " +
              esc(row.end) +
              " · Selected date " +
              pct(row.path.at(-1)) +
              " · Weighted mean " +
              pct(g.mean.at(-1)) +
              "</p>",
          ) +
          '<div class="split">' +
          panel(
            '<div class="row"><h2>Historical votes</h2><select class="selector" id="group" aria-label="Group votes">' +
              ["year", "month", "day"]
                .map((x) => "<option " + (x === group ? "selected" : "") + ">" + x + "</option>")
                .join("") +
              '</select></div><p class="note">Largest ' +
              Math.min(8, sorted.length) +
              " bins by vote mass</p>" +
              sorted
                .map(
                  (x) =>
                    '<div class="bar"><span>' +
                    esc(x[0]) +
                    '</span><i style="width:' +
                    (100 * x[1]) / sorted[0][1] +
                    '%"></i><span>' +
                    num(x[1], 2) +
                    "</span></div>",
                )
                .join(""),
          ) +
          panel(
            "<h2>Evidence for " +
              esc(row.day) +
              "</h2>" +
              memo("Current headline", row.query || "No representative in the displayed fused matches.") +
              memo("Historical headline", row.match || "No representative in the displayed fused matches.") +
              (row.note
                ? memo("Reader assessment", row.note.assessment) +
                  memo("Important difference", row.note.differences?.[0] ?? "No difference supplied.")
                : '<p class="note">This date has no separate reader annotation.</p>'),
          ) +
          "</div>" +
          panel(
            '<div class="row"><h2>Scope of the comparison</h2>' +
              (g.producer_page ? '<button id="open-gdelt">Open GDELT research</button>' : external(
                d.gdelt_url ||
                  "https://github.com/camda03/cmu-portfolio-hedge-capstone/tree/main/gdelt",
                d.gdelt_url ? "Open GDELT research" : "GDELT source code",
              )) +
              '</div><ul class="list">' +
              g.limitations
                .slice(0, 4)
                .map((x) => "<li>" + esc(x) + "</li>")
                .join("") +
              "</ul>",
          )
        );
      }
      function hedgePage() {
        return (
          title("Hedge decision", m.rationale) +
          (m.position_review_required
            ? '<p class="notice">Existing position is outside the supplied limits. Human review requested.</p>'
            : "") +
          stats(
            ["Current MES", signed(keep), t.contract],
            ["Target MES", signed(target), "Signed ending position"],
            [
              "Change",
              signed(delta),
              m.action === "adjust"
                ? (delta < 0 ? "Sell" : "Buy") +
                  " " +
                  Math.abs(delta) +
                  " contract" +
                  (Math.abs(delta) === 1 ? "" : "s")
                : m.action,
            ],
          ) +
          '<p class="note">' +
          esc(
            control ? "Scripted target selected to exercise the paper ledger" : sample
              ? "Scripted decision · Astra request path exercised with a test response"
              : m.model + " · " + m.reasoning_effort + " reasoning",
          ) +
          " · " +
          esc(m.horizon || "Decision horizon in the original memo") +
          "</p>" +
          panel(m.partial_memo ? "<h2>Worker record</h2><p>The recorded rationale above comes from Friday’s worker output. The archived original contains the complete memo.</p>"+external(d.original_url,"Open original worker session") : control
            ? "<h2>Paper accounting check</h2>" +
              memo("Price source", "Eight IBKR closing bars for " + d.market.session_date +
                ". The simulator values the futures position with the " + t.contract + " contract’s own bar.") +
              memo("Result", "The hedged book differs from the same unhedged stock basket by " +
                money(b.hedge_after_fees_usd, 2) + " after fees. The Paper portfolio tab shows the receipt.") +
              memo("Research available", d.analyst_publication + " from " + d.batch_date + " and the saved GDELT study. A model review uses the same closing-price input.")
            : "<h2>Investment memo</h2>" +
              memo("Market outlook", m.market_view) +
              memo("Held basket", m.basket_view) +
              memo("Since the analyst cutoffs", m.price_interpretation) +
              memo("How the evidence was weighed", m.evidence_weight) +
              memo("Strongest contrary case", m.countercase) +
              memo("Reconsider if", m.reconsider_if),
            "accent",
          ) +
          panel(
            '<h2>Alternatives at the decision time</h2><p class="note">Dollar difference versus keeping ' +
              signed(keep) +
              " MES, after the assumed one-way cost of " +
              money(d.policy.cost_per_contract_usd, 2) +
              " per contract changed.</p>" +
              table(
                [
                  "End MES",
                  "Change",
                  "Net beta",
                  "Rally " + pct(d.policy.scenarios.rally.index_return),
                  "Flat " + pct(d.policy.scenarios.flat.index_return),
                  "Decline " + pct(d.policy.scenarios.decline.index_return),
                ],
                t.candidates.map((x) => [
                  signed(x.target_contracts) + (x.target_contracts === target ? " · chosen" : ""),
                  signed(x.change_contracts),
                  x.net_beta == null ? "—" : num(x.net_beta, 3),
                  ...["rally", "flat", "decline"].map((y) => money(x.scenarios[y].versus_keep_usd, 2)),
                ]),
              ) +
              '<p class="note">Betas ' +
              esc(d.policy.beta_source || "unavailable unless supplied by the operator") +
              ".</p>",
          ) +
          panel(
            "<h2>Decision evidence</h2>" +
              (m.calculator_calls?.length ? details("Astra calculator calls ("+m.calculator_calls.length+")", m.calculator_calls.map(call=>
                memo("Requested what-if",call.arguments)+(call.result.error?memo("Validation",call.result.error):
                  table(["MES target","Net beta","Change fee","What-if total P&L"],call.result.candidates.map(row=>[signed(row.target_contracts),formatBeta(row.net_beta),money(row.change_cost_usd,2),money(row.scenarios.what_if.total_pnl_usd,2)])))).join("")) :
                '<p class="note">The worker computed the standard alternatives before Astra reviewed them.</p>')+
              "<p>" +
              esc(m.partial_memo ? "The verified packet contains seven forecasts. The original memo records Astra’s individual citations." : (m.forecast_ids || []).join(" · ")) +
              '</p><p class="mono">GDELT ' +
              esc(g?.run || d.gdelt_gap) +
              "</p>" +
              details(
                "View input fingerprints",
                '<p class="mono">Analyst packet ' +
                  esc(d.hashes.analysts) +
                  "<br>GDELT handoff " +
                  esc(d.hashes.gdelt) +
                  (closing ? "<br>IBKR closing bars " + esc(d.market.capture_sha256) : "") +
                  "<br>Prompt " +
                  esc(m.prompt_sha256) +
                  "<br>Response " +
                  esc(control ? "Scripted control" : m.response_id) +
                  "</p>",
              ) +
              table(
                closing ? ["Instrument", "Closing price / points", "From previous close", "Session"] :
                  ["Quote", "Price / points", "Observation (ET)", "Feed"],
                Object.entries(d.market.quotes).map(([k, q]) => [
                  k,
                  num(q.last, 2),
                  closing ? (q.prior_close > 0 ? pct(q.last / q.prior_close - 1) : "—") : et(q.observed_at),
                  closing ? q.session_date : d.market.synthetic ? "Synthetic" : q.mode,
                ]),
              ),
          )
        );
      }
      function bookPage() {
        return (
          title(
            "Paper portfolio",
            "The same stock quantities and cash form the unhedged comparison. Simulated MES gains, losses and fees explain the difference between the two books.",
          ) +
          stats(
            ["Hedged NAV", money(b.portfolio_value_usd, 2), "As of " + shortTime(b.as_of)],
            ["Unhedged NAV", money(b.unhedged_value_usd, 2), "Same shares and income"],
            [
              "Overlay after fees",
              money(b.hedge_after_fees_usd, 2),
              money(b.fees_usd, 2) + " cumulative fees",
            ],
          ) +
          panel(
            '<h2>Portfolio value over time</h2><div class="swatches spaced"><span>Hedged book</span><span class="blue">Unhedged comparison</span></div>' +
              chart(
                [hist.map((x) => x.portfolio_value_usd), hist.map((x) => x.unhedged_value_usd)],
                hist.map((x) => shortTime(x.as_of)),
                (n) => money(n),
                "Simulated portfolio values in USD",
              ) +
              '<p class="note">' +
              (closing ? "This rehearsal uses a separate paper book. Each simulated fill uses the MES daily close and the displayed fee." : sample
                ? "The later marks and fill demonstrate the ledger arithmetic. They are synthetic and do not measure strategy performance."
                : "Snapshots reflect the stored simulation journal.") +
              "</p>",
          ) +
          panel(
            "<h2>Holdings & cash</h2>" +
              table(
                ["Instrument", "Quantity", "Mark", "Value / open P&L"],
                [
                  ...Object.entries(b.equities).map(([k, p]) => [
                    k,
                    num(p.shares),
                    money(p.mark, 2),
                    money(p.value_usd, 2),
                  ]),
                  ...Object.entries(b.futures).map(([k, p]) => [
                    k,
                    signed(p.contracts),
                    num(p.mark, 2) + " pts",
                    money(p.unrealized_usd, 2) + " P&L",
                  ]),
                  ["Cash", "—", "—", money(b.cash_usd, 2)],
                ],
              ),
          ) +
          panel(
            "<h2>Simulated decision journal</h2>" +
              (d.tracker.decisions.length
                ? table(
                    ["Decision time", "Receipt", "Contract", "Signed change", "Fill", "Fee"],
                    d.tracker.decisions.map((e) => [
                      et(e.at),
                      e.receipt.status,
                      e.contract ?? "—",
                      e.contracts == null ? "—" : signed(e.contracts),
                      e.receipt.fill_price ?? "—",
                      e.fee_usd == null ? "—" : money(e.fee_usd, 2),
                    ]),
                  )
                : '<p class="empty">No simulated trade decisions recorded.</p>') +
              '<p class="note">' +
              esc(b.opening_assumption) +
              "</p>",
          )
        );
      }
      @@OVERVIEW@@
      @@EVIDENCE@@
      const pages = {
        overview: overviewPage, journal: journalPage, freshness: freshnessPage,
        map: mapPage,
        analysts: analystPage,
        gdelt: gdeltPage,
        hedge: hedgePage,
        portfolio: bookPage,
      };
      function show(key, scroll) {
        if (!Object.hasOwn(pages, key)) key = "overview";
        for (let b of document.querySelectorAll("nav button")) {
          b.classList.toggle("on", b.dataset.page === key);
          if (b.dataset.page === key) b.setAttribute("aria-current", "page");
          else b.removeAttribute("aria-current");
        }
        v.innerHTML = pages[key]();
        if (key === "analysts") showReceipt();
        if (scroll) window.scrollTo(0, 0);
      }
      document.querySelector("nav").innerHTML = Object.entries(navGroups).map(([title,tabs]) =>
        '<span class="nav-group">'+title+'</span>'+Object.entries(tabs).map(([key,name]) =>
          '<button data-page="'+key+'">'+name+'</button>').join("")).join("");
      document.querySelector("#mode").textContent = closing ? "Closing-price rehearsal" : sample ? "Scripted rehearsal" : "Market-hours advisory";
      document.querySelector("#asof").textContent = d.snapshot_asof_label || "Review as of "+et(d.as_of);
      const archiveLink = document.querySelector("#worker-files");
      if (!sample && !control && d.worker_archive && new URL(d.worker_archive).protocol === "https:") {
        archiveLink.href = d.worker_archive;
        archiveLink.hidden = false;
      }
      document.querySelector("#largeMap").src = mapSrc;
      document.addEventListener("click", (e) => {
        const el = e.target.closest("button");
        if (!el) return;
        if (el.dataset.page) {
          location.hash = el.dataset.page;
          show(el.dataset.page, true);
        }
        if (el.dataset.switch) {
          if (["difference","totals"].includes(el.dataset.switch)) compareMode=el.dataset.switch;
          else performanceMode=el.dataset.switch;
          show("overview",false);
        }
        if (el.dataset.stock) {
          stock = el.dataset.stock;
          show("analysts", false);
        }
        if (el.id === "open-gdelt") {
          const dialog=document.querySelector("#gdelt-dialog");
          dialog.querySelector("iframe").srcdoc=g.producer_page;
          dialog.showModal();
        }
        if (el.id === "expand") document.querySelector("#mapdialog").showModal();
      });
      document.addEventListener("change", async (e) => {
        let el = e.target;
        if (el.id === "datepick" || el.id === "group") {
          if (el.id === "datepick") day = el.value;
          else group = el.value;
          show("gdelt", false);
        }
        if (el.id === "inspectSymbol") {
          inspectSymbol = el.value;
          showReceipt();
        }
        if (el.id === "realPacket" && el.files.length) {
          const r = receiptData;
          inspected = null;
          packetError = "";
          try {
            const packet = await inspectPacket(el.files[0], r);
            if (r !== receiptData) return;
            inspected = packet;
            inspectSymbol = "AAPL";
          } catch (err) {
            if (r !== receiptData) return;
            packetError = err.message;
          }
          showReceipt();
        }
        if (el.id === "receipt" && el.files.length) {
          inspected = null;
          packetError = "";
          try {
            if (el.files[0].size > 2e6) throw Error("Receipt too large");
            let r = JSON.parse(await el.files[0].text());
            if (
              !r.run_id ||
              !r.session_date ||
              !r.status ||
              !r.subjects ||
              !Object.values(r.subjects).every((x) => typeof x?.status === "string")
            )
              throw Error("Expected dated producer status.json");
            receiptData = r;
          } catch (err) {
            receiptData = { error: err.message };
          }
          showReceipt();
        }
      });
      window.addEventListener("hashchange", () => show(location.hash.slice(1), true));
      show(location.hash.slice(1) || "overview", false);
    </script>
  </body>
</html>
