<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Google Cloud deployment</title>
  <desc id="desc">One Compute Engine VM hosts the analyst, GDELT and portfolio hedge workers. BigQuery serves the GDELT worker. Cloud Storage carries the seven reports to the hedge worker and the private Cloud Run viewer. The GDELT worker delivers six files locally. External dependencies and viewer routes are identified separately.</desc>
  <defs>
    <marker id="arrow-start" markerWidth="12" markerHeight="12" refX="1" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12">
      <path d="M11 0 L0 6 L11 12 Z" fill="#52716F"/>
    </marker>
    <marker id="arrow-end" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12">
      <path d="M1 0 L12 6 L1 12 Z" fill="#52716F"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <g id="project">
    <title>Google Cloud project</title>
    <rect x="52" y="164" width="1014" height="653" rx="11" fill="#FAFBF9" stroke="#94AAA2" stroke-width="1.9"/>
    <text x="72" y="199" font-family="Open Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#146B61" text-anchor="start" letter-spacing="0.65">GOOGLE CLOUD PROJECT</text>
    <text x="182" y="530" font-family="Open Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#146B61" text-anchor="end">Publish</text>
    <text x="342" y="548" font-family="Open Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#146B61" text-anchor="start">Read reports / archive hedge results</text>
    <text x="900" y="521" font-family="Open Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#146B61" text-anchor="start">SQL jobs /</text>
    <text x="900" y="543" font-family="Open Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#146B61" text-anchor="start">results</text>
    <text x="78" y="769" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">The VM uses its attached service account for Cloud Storage and Google Secret Manager.</text>
    <text x="78" y="797" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">The operator starts a dated research batch before a potential hedge session.</text>
  </g>
  <g id="vm">
    <title>Compute Engine VM</title>
    <rect x="72" y="218" width="974" height="260" rx="8" fill="#EDF4F0" stroke="#73A193" stroke-width="2.2"/>
    <text x="91" y="257" font-family="Open Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#18343E" text-anchor="start">Compute Engine VM</text>
    <text x="1025" y="255" font-family="Open Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#146B61" text-anchor="end">Shared worker instance · us-central1-a</text>
    <text x="755.0" y="338" font-family="Open Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#146B61" text-anchor="middle">6 files</text>
    <text x="755.0" y="379" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#146B61" text-anchor="middle">on VM</text>
  </g>
  <g id="analyst">
    <title>Analyst worker</title>
    <rect x="91" y="283" width="263" height="145" rx="8" fill="#FFFFFF" stroke="#A3B3B8" stroke-width="1.8"/>
    <text x="106" y="309" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#146B61" text-anchor="start" letter-spacing="0.35">RESEARCH</text>
    <text x="106" y="341" font-family="Open Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#18343E" text-anchor="start">Analyst worker</text>
    <text x="106" y="367" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">Runs seven roles for each</text>
    <text x="106" y="390" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">subject. Up to two</text>
    <text x="106" y="413" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">subjects at once.</text>
  </g>
  <g id="hedge">
    <title>Portfolio hedge worker</title>
    <rect x="413" y="283" width="306" height="145" rx="8" fill="#E7F2ED" stroke="#82A99D" stroke-width="1.8"/>
    <text x="428" y="309" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#146B61" text-anchor="start" letter-spacing="0.35">PORTFOLIO</text>
    <text x="428" y="341" font-family="Open Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#18343E" text-anchor="start">Portfolio hedge worker</text>
    <text x="428" y="367" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">Evaluates futures hedges. The</text>
    <text x="428" y="390" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">paper simulator records fills in</text>
    <text x="428" y="413" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">SQLite.</text>
  </g>
  <g id="analog">
    <title>GDELT worker</title>
    <rect x="791" y="283" width="236" height="145" rx="8" fill="#FFFFFF" stroke="#A3B3B8" stroke-width="1.8"/>
    <text x="806" y="309" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#146B61" text-anchor="start" letter-spacing="0.35">HISTORICAL ANALOGS</text>
    <text x="806" y="341" font-family="Open Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#18343E" text-anchor="start">GDELT worker</text>
    <text x="806" y="366" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">Interprets historical</text>
    <text x="806" y="389" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">matches and S&amp;P 500</text>
    <text x="806" y="412" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">return paths.</text>
  </g>
  <g id="gcs">
    <title>Cloud Storage</title>
    <rect x="91" y="576" width="263" height="163" rx="8" fill="#FFFFFF" stroke="#A3B3B8" stroke-width="1.8"/>
    <text x="106" y="602" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#146B61" text-anchor="start" letter-spacing="0.35">MANAGED STORAGE</text>
    <text x="106" y="634" font-family="Open Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#18343E" text-anchor="start">Cloud Storage</text>
    <text x="106" y="659" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">Dated receipt, immutable</text>
    <text x="106" y="682" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">report packet and</text>
    <text x="106" y="705" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">archived hedge outputs.</text>
  </g>
  <g id="run">
    <title>Cloud Run</title>
    <rect x="413" y="576" width="306" height="163" rx="8" fill="#FFFFFF" stroke="#A3B3B8" stroke-width="1.8"/>
    <text x="428" y="602" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#146B61" text-anchor="start" letter-spacing="0.35">MANAGED VIEWER</text>
    <text x="428" y="634" font-family="Open Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#18343E" text-anchor="start">Cloud Run</text>
    <text x="428" y="659" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">Private research dashboard</text>
    <text x="428" y="682" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">reads the published reports for</text>
    <text x="428" y="705" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">signed-in reviewers.</text>
  </g>
  <g id="bq">
    <title>BigQuery</title>
    <rect x="766" y="576" width="261" height="163" rx="8" fill="#FFFFFF" stroke="#A3B3B8" stroke-width="1.8"/>
    <text x="781" y="602" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#146B61" text-anchor="start" letter-spacing="0.35">MANAGED ANALYTICS</text>
    <text x="781" y="634" font-family="Open Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#18343E" text-anchor="start">BigQuery</text>
    <text x="781" y="659" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">2M historical documents,</text>
    <text x="781" y="682" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">S&amp;P 500 closes and</text>
    <text x="781" y="705" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">Gemini embeddings for</text>
    <text x="781" y="728" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">retrieval.</text>
  </g>
  <path id="wire-0" d="M 791 354 L 719 354" fill="none" stroke="#52716F" stroke-width="2.6" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#arrow-end)">
    <title>Six local evidence files</title>
  </path>
  <path id="wire-1" d="M 195 428 L 195 576" fill="none" stroke="#52716F" stroke-width="2.6" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#arrow-end)">
    <title>Publish dated reports</title>
  </path>
  <path id="wire-2" d="M 330 576 L 330 518 L 506 518 L 506 428" fill="none" stroke="#52716F" stroke-width="2.6" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#arrow-end)" marker-start="url(#arrow-start)">
    <title>Research packet and hedge archives</title>
  </path>
  <path id="wire-3" d="M 354 650 L 413 650" fill="none" stroke="#52716F" stroke-width="2.6" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#arrow-end)">
    <title>Dashboard reads the stored packet</title>
  </path>
  <path id="wire-4" d="M 890 428 L 890 576" fill="none" stroke="#52716F" stroke-width="2.6" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#arrow-end)" marker-start="url(#arrow-start)">
    <title>Run query and return matches</title>
  </path>
  <path id="wire-5" d="M 1096 320 L 1548 320" fill="none" stroke="#C5D2CE" stroke-width="1.4" stroke-linecap="butt" stroke-linejoin="round">
    <title>ext-rule-ibkr</title>
  </path>
  <path id="wire-6" d="M 1096 452 L 1548 452" fill="none" stroke="#C5D2CE" stroke-width="1.4" stroke-linecap="butt" stroke-linejoin="round">
    <title>ext-rule-openai</title>
  </path>
  <path id="wire-7" d="M 1096 584 L 1548 584" fill="none" stroke="#C5D2CE" stroke-width="1.4" stroke-linecap="butt" stroke-linejoin="round">
    <title>ext-rule-ops</title>
  </path>
  <path id="wire-8" d="M 1096 691 L 1548 691" fill="none" stroke="#C5D2CE" stroke-width="1.4" stroke-linecap="butt" stroke-linejoin="round">
    <title>ext-rule-viewers</title>
  </path>
  <path id="wire-9" d="M 52 842 L 1548 842" fill="none" stroke="#C5D2CE" stroke-width="1.4" stroke-linecap="butt" stroke-linejoin="round">
    <title>footrule</title>
  </path>
  <text x="52" y="38" font-family="Open Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#146B61" text-anchor="start" letter-spacing="1.5">PHYSICAL ARCHITECTURE</text>
  <text x="50" y="95" font-family="Liberation Serif, Georgia, serif" font-size="53" font-weight="400" fill="#18343E" text-anchor="start">Google Cloud deployment</text>
  <text x="52" y="133" font-family="Open Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#344F59" text-anchor="start">Three worker programs share one virtual machine. BigQuery runs historical matching, and OpenAI runs the language models.</text>
  <text x="1096" y="199" font-family="Open Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#18343E" text-anchor="start">Connections beyond the project</text>
  <text x="1096" y="244" font-family="Open Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#146B61" text-anchor="start">GDELT → BigQuery</text>
  <text x="1096" y="273" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">Public Global Knowledge Graph (GKG) tables</text>
  <text x="1096" y="297" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">supply news metadata.</text>
  <text x="1096" y="346" font-family="Open Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#146B61" text-anchor="start">Interactive Brokers → two workers</text>
  <text x="1096" y="375" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">Read-only MCP supplies analyst reference closes.</text>
  <text x="1096" y="399" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">The hedge worker separately requests stock,</text>
  <text x="1096" y="423" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">cash-index and futures prices.</text>
  <text x="1096" y="478" font-family="Open Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#146B61" text-anchor="start">All three workers → OpenAI</text>
  <text x="1096" y="507" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">The Responses API returns GPT-6.2 Sol and Astra</text>
  <text x="1096" y="531" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">results. Hosted web search retrieves filings, issuer</text>
  <text x="1096" y="555" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">releases and news.</text>
  <text x="1096" y="610" font-family="Open Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#146B61" text-anchor="start">GitHub → operator terminal → VM</text>
  <text x="1096" y="639" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">The operator stages pinned code over SSH through</text>
  <text x="1096" y="663" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">Google Identity-Aware Proxy.</text>
  <text x="1096" y="717" font-family="Open Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#146B61" text-anchor="start">Published results → reviewers</text>
  <text x="1096" y="746" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">Reviewers use the signed-in research dashboard. A</text>
  <text x="1096" y="770" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">private ChatGPT Sites Hedge Desk displays a saved</text>
  <text x="1096" y="794" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#344F59" text-anchor="start">portfolio snapshot.</text>
  <text x="52" y="875" font-family="Open Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#18343E" text-anchor="start">November 20, 2026 · The hosted rehearsal combined seven reports, six GDELT evidence files and eight IBKR closing-price histories in a simulated hedge decision.</text>
</svg>
