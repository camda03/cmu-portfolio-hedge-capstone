<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="973" viewBox="0 0 1540 973" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio hedge architecture</title>
  <desc id="desc">The Equity and Index Research Team publishes seven forecasts. A separate GDELT research worker supplies historical news matches and S&amp;P 500 return paths. The portfolio hedge worker weighs both studies with the alternatives computed from independently obtained Interactive Brokers prices and the simulated portfolio. It records a decision to hold, adjust or defer. For an adjustment in the closing-price rehearsal, the paper simulator updates the SQLite ledger. The dashboard compares the hedged portfolio with the same holdings without the futures overlay.</desc>
