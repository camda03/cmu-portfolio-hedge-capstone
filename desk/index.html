<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Portfolio hedge desk · CMU Capstone</title>
  <style>
:root {
  color-scheme: light;
  --ink: #15243b;
  --sub: #485973;
  --muted: #566981;
  --teal: #007b68;
  --nav: #101c30;
  --blue: #385bcb;
  --paper: #f3f6fa;
  --panel: white;
  --line: #d8e0ea;
  --up: #067965;
  --down: #a34c32;
  font: 16px/1.48 "Inter", "Arial", sans-serif;
}

* {
  box-sizing: border-box
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink)
}

button,
input,
select {
  font: inherit
}

button,
select,
summary,
a {
  touch-action: manipulation
}

button,
select,
.button,
.file-button {
  border: 1px solid var(--line);
  border-radius: 7px;
  background: white;
  color: var(--ink);
  padding: 8px 12px;
  font-weight: 600;
  font-size: .875rem;
  cursor: pointer
}

button:hover,
.button:hover,
.file-button:hover,
select:hover {
  background: #ecf1fa
}

:focus-visible {
  outline: 3px solid #527bff;
  outline-offset: 3px
}

a {
  color: #2d50b4;
  text-underline-offset: 3px
}

.shell {
  display: grid;
  grid-template-columns: 205px minmax(0, 1fr);
  min-height: 100vh
}

aside {
  background: var(--nav);
  color: #f6f9ff;
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 30px 15px 18px;
  display: flex;
  flex-direction: column
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 9px 29px;
  color: #fff;
  text-decoration: none;
  font-size: 1.26rem;
  font-weight: 750;
  letter-spacing: -.045em
}

.brand small {
  display: block;
  color: #bdcbe1;
  letter-spacing: .12em;
  text-transform: uppercase;
  font-size: .65rem;
  font-weight: 650;
  margin-top: 1px
}

.brand-mark {
  width: 33px;
  height: 33px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 3px;
  background: #5677f0;
  border-radius: 8px;
  padding: 7px;
  flex-shrink: 0
}

.brand-mark i {
  display: block;
  width: 4px;
  background: white;
  border-radius: 2px
}

.brand-mark i:nth-child(1) {
  height: 8px
}

.brand-mark i:nth-child(2) {
  height: 13px
}

.brand-mark i:nth-child(3) {
  height: 18px
}

nav {
  display: grid;
  gap: 4px
}

nav button {
  text-align: left;
  background: transparent;
  border: 0;
  color: #c6d2e5;
  padding: 10px 13px;
  font-weight: 520;
  font-size: .94rem;
  border-radius: 6px
}

nav button:hover {
  background: #1a2c47;
  color: #fff
}

nav button.on {
  background: #293e66;
  color: white;
  box-shadow: inset 3px 0 #91a8ff
}

.nav-group {
  font-size: .71rem;
  color: #a4b4cc;
  text-transform: uppercase;
  letter-spacing: .13em;
  font-weight: 650;
  margin: 22px 12px 5px
}

nav .nav-group:first-child {
  margin-top: 8px
}

aside footer {
  margin-top: auto;
  border-top: 1px solid #2e3b50;
  padding: 18px 8px 0;
  color: #c6d2e5;
  font-size: .82rem
}

main {
  min-width: 0;
  width: 100%;
  max-width: 1580px;
  margin: auto;
  margin-top: 0;
  padding: 0 clamp(18px, 3vw, 46px) 36px
}

.top {
  min-height: 63px;
  display: flex;
  gap: 13px;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  color: var(--sub);
  font-size: .83rem
}

.top-left,
.top-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap
}

.mode {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-weight: 650
}

.mode:before {
  content: "";
  width: 8px;
  height: 8px;
  background: #4973ba;
  border-radius: 50%
}

.file-button input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0
}

.file-button:focus-within {
  outline: 3px solid #527bff
}

#run-error:empty {
  display: none
}

article {
  min-width: 0
}

.page-heading {
  margin: 24px 0 19px
}

h1 {
  font-size: clamp(1.95rem, 3vw, 2.9rem);
  letter-spacing: -.06em;
  line-height: 1.12;
  margin: 25px 0 7px
}

.page-heading h1 {
  margin: 0 0 6px
}

.page-heading p,
.intro,
.note,
.empty,
.source-date,
.origin-note {
  color: var(--sub)
}

.page-heading p {
  margin: 0;
  font-size: .97rem
}

.page-heading p span {
  margin: 0 5px;
  color: #9aa9bc
}

h2 {
  font-size: 1.12rem;
  letter-spacing: -.026em;
  margin: 0 0 8px;
  line-height: 1.3
}

h3 {
  font-size: .98rem;
  margin: 0 0 5px
}

.intro {
  max-width: 88ch;
  margin: 0 0 19px
}

.note,
.empty {
  font-size: .87rem;
  line-height: 1.55;
  margin: 6px 0 12px
}

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap
}

.row h2 {
  margin: 0
}

.kpis {
  background: white;
  border: 1px solid var(--line);
  border-radius: 12px;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  padding: 19px 0;
  margin: 14px 0 16px
}

.kpi {
  padding: 0 clamp(12px, 1.45vw, 24px);
  display: grid;
  gap: 4px
}

.kpi+.kpi {
  border-left: 1px solid var(--line)
}

.kpi>span,
.stat label {
  color: #415470;
  font-weight: 600;
  font-size: .85rem
}

.kpi strong,
.stat strong,
.pos-number,
.amount,
td,
.perf-legend strong {
  font-variant-numeric: tabular-nums
}

.kpi strong {
  font-weight: 650;
  font-size: clamp(1.45rem, 2.2vw, 2.15rem);
  letter-spacing: -.055em;
  line-height: 1.25
}

.kpi small,
.stat span {
  font-size: .79rem;
  color: var(--muted)
}

.primary-ink {
  color: var(--blue)
}

.gain-ink {
  color: var(--up)
}

.cost-ink {
  color: var(--down)
}

.overview-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.68fr) minmax(242px, 1fr);
  gap: 16px;
  align-items: stretch
}

.panel,
.position,
.stats {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  min-width: 0;
  margin: 0 0 14px;
  padding: 20px 22px
}

.overview-grid>.panel,
.overview-grid>.position {
  margin: 0
}

.panel>p:last-child {
  margin-bottom: 0
}

.position {
  background: #192b49;
  color: #f8fbff;
  border-color: #192b49;
  display: flex;
  flex-direction: column
}

.pos-head,
.pos-foot,
.position dl div {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px
}

.pos-head h2 {
  margin: 0;
  font-size: 1.03rem;
  color: #e5ebf5
}

.paper-tag {
  font-size: .73rem;
  background: #2e4468;
  color: #e4edff;
  padding: 3px 8px;
  border-radius: 4px
}

.pos-number {
  font-size: clamp(1.9rem, 3vw, 3rem);
  font-weight: 650;
  line-height: 1.1;
  letter-spacing: -.055em;
  margin: 17px 0 2px
}

.pos-number span {
  font-size: .53em;
  color: #b3c7f2;
  letter-spacing: 0
}

.position p,
.pos-foot>span,
.position dt {
  color: #c0cfea;
  font-size: .84rem
}

.position p {
  margin: 3px 0 12px
}

.position dl {
  margin: 0 0 10px
}

.position dl div {
  padding: 3px 0
}

.position dd {
  margin: 0;
  font-weight: 600;
  font-variant-numeric: tabular-nums
}

.pos-foot {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid #3b506e
}

.textlink {
  font-weight: 650;
  font-size: .87rem;
  text-decoration: none
}

.textlink:hover {
  text-decoration: underline
}

.position .textlink {
  color: #c8d5ff
}

.seg {
  display: inline-flex;
  gap: 2px;
  background: #edf1f7;
  border: 1px solid #dce3ed;
  padding: 2px;
  border-radius: 7px
}

.seg button {
  background: transparent;
  color: #52637b;
  border: 0;
  font-size: .79rem;
  padding: 4px 9px;
  border-radius: 4px
}

.seg button[aria-pressed=true] {
  background: #fff;
  color: #263e79;
  box-shadow: 0 1px 3px #23376025
}

.stressgraph {
  margin: 15px 0
}

.stressrow {
  display: grid;
  grid-template-columns: minmax(98px, .82fr) minmax(58px, 1.3fr) minmax(76px, .62fr);
  gap: 10px;
  align-items: center;
  padding: 7px 0
}

.stressrow strong,
.amount {
  font-size: .9rem
}

.stressrow small {
  color: var(--muted);
  display: block;
  font-size: .75rem;
  font-weight: 450
}

.track {
  position: relative;
  height: 27px;
  background: repeating-linear-gradient(90deg, #f4f6fa, #f4f6fa calc(25% - 1px), #e0e7ef calc(25% - 1px), #e0e7ef 25%);
  border-radius: 3px
}

.zero {
  position: absolute;
  height: 100%;
  top: 0;
  left: 50%;
  border-left: 1px solid #a1afbf
}

.trackbar {
  position: absolute;
  border-radius: 2px;
  min-width: 1px
}

.track.single .trackbar {
  height: 10px;
  top: 8px
}

.track.paired .unhedged {
  height: 7px;
  top: 5px
}

.track.paired .selected {
  height: 7px;
  bottom: 5px
}

.gain {
  background: #168c79
}

.cost {
  background: #bd724d
}

.selected {
  background: #4d68c8
}

.unhedged {
  background: #8998ab
}

.amount {
  text-align: right;
  font-weight: 650
}

.legend,
.perf-legend {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  color: var(--sub);
  font-size: .78rem
}

.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 2px;
  flex: none
}

.legend .dot:not(:first-child) {
  margin-left: 10px
}

.perf-legend {
  margin: 13px 0 2px;
  gap: 14px
}

.perf-legend>span {
  display: inline-flex;
  align-items: center;
  gap: 6px
}

.perf-legend strong {
  color: var(--ink)
}

.figure {
  margin: 7px 0 3px
}

.figure svg {
  width: 100%;
  display: block;
  height: auto;
  max-height: 265px
}

.research-hub h2 {
  margin-bottom: 11px
}

.research-link {
  color: var(--ink);
  text-decoration: none;
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 12px 0 2px
}

.research-link:hover b {
  text-decoration: underline
}

.research-link span:nth-child(2) {
  flex: 1;
  min-width: 0
}

.research-link b,
.research-link small {
  display: block
}

.research-link b {
  font-size: .96rem
}

.research-link small,
.source-date {
  color: var(--muted);
  font-size: .78rem
}

.source-icon {
  border-radius: 7px;
  display: grid;
  place-items: center;
  width: 32px;
  height: 35px;
  font-size: .93rem;
  font-weight: 750
}

.reports-icon {
  color: #3f57ae;
  background: #eef0fb
}

.analog-icon {
  color: #06755c;
  background: #e3f2eb
}

.chevron {
  color: #536784;
  font-size: 1.3rem
}

.source-date {
  margin: 1px 0 4px 42px
}

.source-date+.research-link {
  border-top: 1px solid var(--line);
  margin-top: 11px
}

.origin-note {
  font-size: .8rem;
  margin: 14px 1px
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 14px
}

.stat {
  display: grid;
  gap: 4px;
  overflow-wrap: anywhere
}

.stat strong {
  font-size: 1.38rem
}

.stats+.note {
  margin-bottom: 12px
}

.split {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px
}

.scroll {
  overflow: auto
}

.map {
  width: 100%;
  display: block
}

table {
  border-collapse: collapse;
  width: 100%;
  font-size: .86rem;
  text-align: left
}

.scroll th,
.scroll td {
  border-bottom: 1px solid #e5eaf0;
  padding: 9px 10px
}

.scroll th {
  color: var(--sub);
  font-weight: 650;
  background: #f5f7fb
}

.chips,
.trace,
.swatches {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap
}

.chips .chosen {
  color: #fff;
  background: #3854a6
}

.trace {
  margin: 10px 0
}

.trace span {
  background: #eef2f8;
  border-radius: 4px;
  padding: 2px 7px;
  font-size: .79rem
}

.report {
  white-space: pre-wrap;
  font: 1rem/1.65 "Georgia", serif;
  max-height: 560px;
  overflow: auto;
  margin: 12px 0;
  background: #fafbfd;
  border: 1px solid var(--line);
  padding: 16px;
  border-radius: 6px;
  overflow-wrap: anywhere
}

details {
  margin-top: 12px
}

summary {
  font-size: .89rem;
  color: #344b83;
  font-weight: 600
}

.mono {
  font: .8rem/1.5 "IBM Plex Mono", monospace;
  overflow-wrap: anywhere
}

.memo,
.receipt {
  margin: 12px 0
}

.memo p {
  margin: 2px 0;
  color: var(--sub)
}

.measure {
  max-width: 86ch
}

.button {
  text-decoration: none;
  display: inline-flex
}

.notice,
.warning-strip {
  padding: 10px 13px;
  background: #fff5dd;
  border: 1px solid #e7d19e;
  border-radius: 7px;
  color: #694708;
  font-size: .87rem
}

.warning-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 0 16px
}

.warning-strip a {
  color: #714b04;
  white-space: nowrap
}

.swatches {
  gap: 15px;
  font-size: .82rem
}

.swatches span:before {
  content: "";
  display: inline-block;
  width: 15px;
  margin: 0 5px 3px 0;
  border-top: 3px solid #4d68c8
}

.swatches .blue:before {
  border-color: #828fa2;
  border-top-style: dashed
}

.selector {
  max-width: 100%;
  min-width: 105px
}

.bar {
  display: grid;
  grid-template-columns: 110px 1fr 50px;
  align-items: center;
  gap: 7px;
  font-size: .84rem;
  margin: 5px 0
}

.bar i {
  height: 8px;
  background: #7286cd;
  border-radius: 3px
}

.list {
  padding-left: 20px;
  color: var(--sub)
}

dialog {
  max-width: min(96vw, 1400px);
  max-height: 94vh;
  border: 1px solid var(--line);
  border-radius: 12px
}

dialog::backdrop {
  background: #0f192bb3
}

.quality-row {
  padding: 9px 0;
  border-bottom: 1px solid #e5eaf0
}

.state {
  font-size: .8rem;
  font-weight: 650
}

.state.warn {
  color: #956117
}

.state.bad {
  color: #a43732
}

.state.ok {
  color: #087264
}

.state.info {
  color: #3963a1
}

nav button,
.seg button,
.textlink,
.button {
  transition: background .13s, color .13s
}

.skip {
  position: absolute;
  left: -10000px
}

.skip:focus {
  left: 12px;
  top: 8px;
  background: white;
  padding: 8px;
  z-index: 5
}

@media(max-width:1090px) {
  .shell {
    grid-template-columns: 175px minmax(0, 1fr)
  }

  aside {
    padding: 23px 9px
  }

  .overview-grid {
    grid-template-columns: minmax(0, 1.35fr) minmax(210px, 1fr)
  }

  .panel,
  .position,
  .stats {
    padding: 16px
  }

  .kpi strong {
    font-size: 1.53rem
  }
}

@media(max-width:850px) {
  .shell {
    display: block
  }

  aside {
    height: auto;
    position: static;
    padding: 10px 16px
  }

  .brand {
    padding: 0 0 7px;
    font-size: 1.02rem
  }

  .brand-mark {
    width: 26px;
    height: 26px;
    padding: 5px
  }

  .brand small,
  aside footer,
  .nav-group {
    display: none
  }

  nav {
    display: flex;
    gap: 3px;
    overflow-x: auto
  }

  nav button {
    white-space: nowrap;
    font-size: .84rem;
    padding: 7px 10px
  }

  nav button.on {
    box-shadow: inset 0 -2px #91a8ff
  }

  .overview-grid {
    grid-template-columns: minmax(0, 1.4fr) minmax(215px, 1fr)
  }
}

@media(max-width:660px) {
  .top {
    min-height: 55px
  }

  .top-left {
    gap: 4px;
    align-items: flex-start;
    flex-direction: column
  }

  .overview-grid,
  .split {
    grid-template-columns: 1fr
  }

  .kpis {
    grid-template-columns: 1fr 1fr;
    padding: 0
  }

  .kpi {
    padding: 12px 14px
  }

  .kpi:nth-child(3) {
    border-left: 0
  }

  .kpi:nth-child(n+3) {
    border-top: 1px solid var(--line)
  }

  .kpi strong {
    font-size: 1.57rem
  }

  .page-heading {
    margin-top: 19px
  }

  .panel .row {
    gap: 7px
  }

  .warning-strip {
    align-items: flex-start;
    flex-wrap: wrap
  }

  .brand small {
    display: none
  }

  .page-heading p {
    font-size: .87rem
  }

  .pos-number {
    margin-top: 12px
  }

  .report {
    padding: 10px
  }

  .stressrow {
    gap: 5px
  }
}

@media(prefers-reduced-motion:reduce) {
  * {
    transition: none !important
  }
}

@media print {

  aside,
  .top,
  .seg,
  .file-button,
  .textlink {
    display: none
  }

  .shell,
  main {
    display: block;
    max-width: none;
    padding: 0
  }

  .panel,
  .position,
  .kpis {
    break-inside: avoid
  }

  .position {
    background: white;
    color: var(--ink)
  }

  .position p,
  .position dt,
  .position .pos-number span {
    color: var(--sub)
  }
}

.quality-summary,
.journal-shortcut {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin: 12px 0 15px;
  font-size: .86rem;
  color: var(--sub)
}

.journal-shortcut {
  border-bottom: 1px solid var(--line);
  padding: 7px 0 14px
}

.notice+.warning-strip {
  margin-top: -3px
}

.study-update,
.study-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin: 14px 0
}

.study-update {
  background: #edf6f3;
  border: 1px solid #c5e0d8;
  border-radius: 7px;
  padding: 12px 16px;
  color: #174d43
}

.study-update span,
.study-update strong {
  display: block
}

.study-update span {
  font-size: .9rem
}

.study-update a {
  color: #155d50
}

.study-choices {
  display: flex;
  flex-wrap: wrap;
  gap: 6px
}

.study-choices a {
  padding: 7px 11px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--sub);
  text-decoration: none
}

.study-choices a[aria-current="page"] {
  background: #253e66;
  border-color: #253e66;
  color: white
}

.study-choices a:hover {
  text-decoration: underline
}

#gdelt-dialog {
  width: 96vw;
  height: 92vh
}

#gdelt-dialog iframe {
  width: 100%;
  height: calc(100% - 44px);
  border: 0
}

#gdelt-dialog .row {
  margin-bottom: 8px
}

.research-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 16px
}

.study-choices {

// Plot the supplied time series on shared axes with formatted value labels.
function chart(lines, labels, formatter, ylabel, times = null) {
  const W = 700,
    H = 230,
    L = 83,
    R = 24,
    T = 16,
    B = 37,
    colors = ["#4d68c8", "#8998ab"];
  let vals = lines
    .flat()
    .filter((x) => x != null && Number.isFinite(+x))
    .map(Number);
  if (!vals.length) return '<p class="empty">No path values supplied.</p>';
  let lo = Math.min(...vals),
    hi = Math.max(...vals);
  if (lo === hi) {
    let p = Math.abs(lo) * 0.002 || 0.01;
    lo -= p;
    hi += p;
  } else {
    let p = (hi - lo) * 0.09;
    lo -= p;
    hi += p;
  }
  const elapsed = times && times.at(-1) - times[0],
    // Position a chart point by elapsed time or, when timestamps are unavailable, by index.
    X = (i) => L + (W - L - R) * (elapsed > 0 ? (times[i] - times[0]) / elapsed : i / Math.max(1, labels
      .length - 1)),
    // Convert a plotted value to an SVG height, with larger values nearer the top.
    Y = (n) => T + ((hi - n) * (H - T - B)) / (hi - lo);
  let svg =
    '<svg viewBox="0 0 700 230" role="img" aria-label="' +
    esc(ylabel) +
    '"><title>' +
    esc(ylabel) +
    "</title>";
  for (let i = 0; i <= 4; i++) {
    let n = lo + ((hi - lo) * i) / 4,
      y = Y(n);
    svg +=
      '<path d="M' +
      L +
      " " +
      y +
      "H" +
      (W - R) +
      '" stroke="#dde4df"/><text x="' +
      (L - 7) +
      '" y="' +
      (y + 4) +
      '" text-anchor="end" fill="#455e61" font-size="12">' +
      esc(formatter(n)) +
      "</text>";
  }
  const mid = Math.floor((labels.length - 1) / 2),
    last = labels.length - 1;
  for (const i of new Set([0, ...(X(mid) - X(0) > 100 && X(last) - X(mid) > 100 ? [mid] : []), last]))
    svg +=
    '<text text-anchor="' +
    (i === 0 ? "start" : i === labels.length - 1 ? "end" : "middle") +
    '" x="' +
    X(i) +
    '" y="218" fill="#455e61" font-size="12">' +
    esc(labels[i]) +
    "</text>";
  lines.forEach((line, j) => {
    let prev = false,
      path = "";
    line.forEach((p, i) => {
      if (p == null) {
        prev = false;
        return;
      }
      path += (prev ? "L" : "M") + X(i) + " " + Y(p);
      prev = true;
    });
    svg +=
      '<path d="' +
      path +
      '" fill="none" stroke="' +
      colors[j] +
      '" stroke-width="3" ' +
      (j ? 'stroke-dasharray="7 4"' : "") +
      "/>";
    let k = line.findLastIndex((x) => x != null);
    if (k >= 0)
      svg += '<circle cx="' + X(k) + '" cy="' + Y(line[k]) + '" r="3.5" fill="' + colors[j] + '"/>';
  });
  return '<div class="figure">' + svg + "</svg></div>";
}

// Compare a local packet with its receipt and verify the individual reports.
async function inspectPacket(file, r) {
  if (!window.crypto?.subtle)
    throw Error("Open this HTML locally in a browser that supports SHA-256 verification.");
  // Convert the browser's SHA-256 digest to the hexadecimal form used by the receipt.
  const hash = async (b) =>
    Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", b)), (v) =>
      v.toString(16).padStart(2, "0"),
    ).join("");
  const bytes = await file.arrayBuffer();
  if ((await hash(bytes)) !== r.packet_sha256)
    throw Error("Packet checksum differs from the selected receipt.");
  const p = JSON.parse(new TextDecoder("utf-8", {
    fatal: true
  }).decode(bytes));
  const keys = Object.keys(p.subjects).sort();
  if (
    p.run_id !== r.run_id ||
    p.fleet.test_id !== r.run_id ||
    p.session_date !== r.session_date ||
    p.source_revision !== r.source_revision ||
    p.schema !== "portfolio-research-v1" ||
    p.all_reports_available !== true ||
    p.hourly_monitoring !== false ||
    p.execute !== false ||
    r.packet_key !== "portfolio-research/" + p.run_id + ".json" ||
    keys.join() !==
    a
    .map((x) => x.symbol)
    .sort()
    .join()
  )
    throw Error("The packet does not match this seven-subject batch.");
  for (const k of keys) {
    const item = p.subjects[k];
    if (
      item.symbol !== k ||
      item.forecast.symbol !== k ||
      item.status !== "available" ||
      !item.forecast.forecast_id ||
      !item.report_markdown?.trim() ||
      (await hash(new TextEncoder().encode(item.report_markdown))) !== item.report_sha256
    )
      throw Error("Report verification failed for " + k);
  }
  return p;
}

// Read a finite numeric metric while preserving missing values.
const metricNumber = value => value == null || value === "" || !Number.isFinite(Number(value)) ? null :
  Number(value);
// Describe a signed futures position as long, short, or flat.
const positionName = n => n == null ? "Unavailable" : n === 0 ? "Flat" :
  `${Math.abs(n)} ${n < 0 ? "short" : "long"}`;
// Show the direction and dollar size of a portfolio contribution.
const signedMoney = (n, places = 2) => n == null ? "—" : (n > 0 ? "+" : "") + money(n, places);
// Calculate cumulative return relative to the opening portfolio value.
const returnFrom = (value, start) => start > 0 && value != null ? Number(value) / start - 1 : null;
const booked = b.futures[t.contract]?.contracts ?? 0;
const nav = metricNumber(b.portfolio_value_usd),
  benchmark = metricNumber(b.unhedged_value_usd);
const startNav = metricNumber(b.opening_value_usd),
  effect = metricNumber(b.hedge_after_fees_usd);
const multiplier = Number(d.policy.future.multiplier);
const unit = metricNumber(t.mes_unit_notional_usd);
const otherOverlay = Object.entries(b.futures).filter(([contract]) => contract !== t.contract)
  .reduce((sum, [, leg]) => sum + leg.contracts * Number(leg.mark) * multiplier, 0);
const anchor = t.candidates.find(row => metricNumber(row.net_beta) !== null);
const decisionNav = metricNumber(t.valuation_nav_usd);
const equityBeta = anchor && decisionNav > 0 && unit > 0 ?
  anchor.net_beta - (anchor.target_contracts * unit + otherOverlay) / decisionNav : null;
const bookedBeta = equityBeta == null ? null : equityBeta + (booked * unit + otherOverlay) / decisionNav;
const proposed = t.candidates.find(row => row.target_contracts === target);
const scenarioNames = ["decline", "flat", "rally"].filter(name => proposed?.scenarios?.[name]);
let compareMode = "difference",
  performanceMode = "returns";
// Format a calendar date without moving it across a timezone boundary.
const calendarDay = s => new Intl.DateTimeFormat("en-US", {
    month: "short",
    day: "numeric",
    year: "numeric",
    timeZone: "UTC"
  })
  .format(new Date(s + "T12:00:00Z"));
// Create a link to another section of the portfolio desk.
const linkPage = (key, text) => `<a class="textlink" href="#${key}">${esc(text)}</a>`;
// Render one overview metric with its label, value, and context.
const kpi = (label, value, hint, color = "") =>
  `<div class="kpi"><span>${esc(label)}</span><strong class="${color}">${esc(value)}</strong><small>${esc(hint)}</small></div>`;
// Display portfolio beta to three decimal places when it is available.
const formatBeta = beta => beta == null ? "—" : num(beta, 3);
// Build the buttons for switching between measures and mark the active choice.
const segment = (name, options, selected) => `<div class="seg" role="group" aria-label="${esc(name)}">` +
  options.map(([key, label]) =>
    `<button data-switch="${key}" aria-pressed="${key === selected}">${esc(label)}</button>`).join("") +
  "</div>";

// Show how the selected hedge performs under each market scenario.
function stressPanel() {
  if (!proposed || !scenarioNames.length) return panel(
    "<h2>Decision scenarios</h2><p>Scenario estimates are unavailable for this run.</p>");
  const rows = scenarioNames.map(key => {
    const scenario = proposed.scenarios[key],
      total = metricNumber(scenario.total_pnl_usd),
      overlay = metricNumber(scenario.overlay_after_cost_usd);
    return {
      key,
      label: {
        decline: "Market decline",
        flat: "Flat market",
        rally: "Market rally"
      } [key],
      market: d.policy.scenarios[key].index_return,
      total,
      overlay,
      base: total == null || overlay == null ? null : total - overlay
    };
  });
  const relative = compareMode === "difference";
  const scale = Math.max(1, ...rows.flatMap(r => relative ? [Math.abs(r.overlay ?? 0)] : [Math.abs(r
    .total ?? 0), Math.abs(r.base ?? 0)]));

  // Scale a scenario bar and place losses and gains on opposite sides of zero.
  function bar(n, cls) {
    if (n == null) return "";
    const width = Math.abs(n) / scale * 48;
    return `<i class="trackbar ${cls}" style="${n < 0 ? "right" : "left"}:50%;width:${width}%"></i>`
  }
  const marks = rows.map(r =>
    `<div class="stressrow"><div><strong>${esc(r.label)}</strong><small>S&amp;P 500 ${esc(pct(r.market))}</small></div>` +
    `<div class="track ${relative?"single":"paired"}" aria-hidden="true"><i class="zero"></i>` +
    (relative ? bar(r.overlay, r.overlay >= 0 ? "gain" : "cost") : bar(r.base, "unhedged") + bar(r
      .total, "selected")) +
    `</div><div class="amount">${relative?signedMoney(r.overlay):signedMoney(r.total)}${relative?"":`<small>${signedMoney(r.base)}</small>`}</div></div>`
    ).join("");
  return panel(
    `<div class="row"><h2>Decision scenarios</h2>${segment("Scenario display",[["difference","Difference"],["totals","Total P&L"]],compareMode)}</div>` +
    `<p class="note">Modeled at the decision marks for the ${esc(positionName(target).toLowerCase())} MES target, including its change fee.</p>` +
    `<div class="stressgraph">${marks}</div>` +
    (relative ?
      '<div class="legend"><i class="dot gain"></i>Protection gained<i class="dot cost"></i>Upside or fee cost</div>' :
      '<div class="legend"><i class="dot selected"></i>Target portfolio<i class="dot unhedged"></i>Unhedged portfolio</div>'
      ));
}

// Display the booked futures position, its mark, and its signed exposure.
function exposureCard() {
  const bookedNotional = booked * unit,
    value = b.futures[t.contract]?.mark ?? d.market.quotes[t.contract]?.last;
  const contractMonth = d.policy.future.contract_month;
  const expiry = new Intl.DateTimeFormat("en-US", {
    month: "long",
    year: "numeric",
    timeZone: "UTC"
  }).format(new Date(contractMonth.slice(0, 4) + "-" + contractMonth.slice(4) + "-01T12:00:00Z"));
  const targetNote = target !== booked ? `Astra target: ${positionName(target).toLowerCase()}.` : "";
  return `<section class="position"><div class="pos-head"><h2>Current hedge</h2><span class="paper-tag">Paper book</span></div>` +
    `<div class="pos-number">${esc(positionName(booked))}<span> MES</span></div><p>Micro E-mini S&amp;P 500 · ${esc(expiry)}</p>` +
    `<dl><div><dt>Signed exposure</dt><dd>${signedMoney(bookedNotional,0)}</dd></div><div><dt>Contract mark</dt><dd>${num(value,2)} pts</dd></div></dl>` +
    `<div class="pos-foot"><span>${esc(targetNote || (m.action === "defer" ? "Decision deferred" : "Recorded position"))}</span>${linkPage("hedge","View decision")}</div></section>`;
}

// Compare the hedged and unhedged books over the same observations.
function performancePanel() {
  const returns = performanceMode === "returns",
    // Choose returns or dollar values for the selected portfolio series.
    chartValues = k => hist.map(pt => returns ? returnFrom(pt[k], startNav) : metricNumber(pt[k]));
  const labels = hist.map(pt => shortTime(pt.as_of));
  const hedgeReturn = returnFrom(nav, startNav),
    baseReturn = returnFrom(benchmark, startNav);
  const values = chart([chartValues("portfolio_value_usd"), chartValues("unhedged_value_usd")], labels,
    returns ? pct : n => money(n, 0), returns ? "Hedged and unhedged paper returns since opening" :
    "Hedged and unhedged paper NAV", hist.map(pt => Date.parse(pt.as_of)));
  const fill = d.tracker.decisions.filter(e => e.receipt?.status === "filled" && e.contract === t
    .contract).at(-1);
  const lastMark = b.futures[t.contract]?.marked_at;
  const noLaterMark = fill && lastMark && Date.parse(lastMark) <= Date.parse(fill.at);
  return panel(
    `<div class="row"><h2>Portfolio performance</h2>${segment("Performance display",[["returns","Return"],["value","NAV"]],performanceMode)}</div>` +
    `<div class="perf-legend"><span><i class="dot selected"></i>Hedged book <strong>${returns?pct(hedgeReturn):money(nav,2)}</strong></span>` +
    `<span><i class="dot unhedged"></i>Unhedged book <strong>${returns?pct(baseReturn):money(benchmark,2)}</strong></span></div>` +
    values +
    `<p class="note">${noLaterMark?"Latest paper valuation is at the fill. The journal has no subsequent MES mark yet. ":""}Lines connect recorded valuations of the same equity holdings and starting cash. Performance includes paper fills and fees.</p>`
    );
}

// Summarize the analyst and news evidence that informed the decision.
function intelligenceCard() {
  const F = a.map(s => s.forecast);
  const estimates = F.filter(f => f.status === "estimate").length;
  let latest = F.map(f => f.information_cutoff).filter(Boolean).sort().at(-1);
  return `<section class="panel research-hub"><h2>Sunday’s research inputs</h2>` +
    `<a class="research-link" href="#analysts-decision"><span class="source-icon reports-icon" aria-hidden="true">A</span><span><b>Equity and Index Research Team</b><small>${a.length} reports · ${estimates} estimates</small></span><span class="chevron" aria-hidden="true">›</span></a>` +
    `<p class="source-date">${latest?"Latest cutoff "+esc(et(latest)):"Cutoff unavailable"}</p>` +
    `<a class="research-link" href="#gdelt-decision"><span class="source-icon analog-icon" aria-hidden="true">G</span><span><b>GDELT study used Sunday</b><small>${g?num(g.queries)+" stories · "+num(g.corpus)+" in history":"Coverage gap"}</small></span><span class="chevron" aria-hidden="true">›</span></a>` +
    `<p class="source-date">${g?"Cohort "+esc(et(g.window.start)):esc(d.gdelt_gap)}</p></section>`;
}

// Bring portfolio values, the hedge, scenarios, and supporting research onto one page.
function overviewPage() {
  const asof = d.session_date || d.market.session_date || d.batch_date;
  const betaChange = bookedBeta == null ? "Estimate unavailable" : "Change " + (bookedBeta - equityBeta >
    0 ? "+" : "") + num(bookedBeta - equityBeta, 3);
  const effectBps = effect == null || !(startNav > 0) ? null : 10000 * effect / startNav;
  return `<header class="page-heading"><h1>Portfolio overview</h1><p>Six-stock paper portfolio <span>·</span> ${esc(calendarDay(asof))} <span>·</span> Prices from ${esc(calendarDay(d.market.session_date))}</p></header>` +
    `<div class="kpis">${kpi("Portfolio value",money(nav,2), "USD · marked paper NAV")}` +
    `${kpi("Unhedged beta",formatBeta(equityBeta),"Same stock basket · decision marks")}` +
    `${kpi("Beta with booked hedge",formatBeta(bookedBeta),betaChange,"primary-ink")}` +
    `${kpi("Hedge contribution",signedMoney(effect,2),effectBps==null?"After recorded fees":num(effectBps,3)+" bp since opening",effect<0?"cost-ink":effect>0?"gain-ink":"")}</div>` +
    `<div class="study-update"><div><strong>Sunday, November 22 research</strong><span>${researchInDecision?"Astra reviewed both inputs and held the existing one-short December MES hedge. No new fee.":"Seven analyst reports and the GDELT study are ready. The recorded hedge below is Friday’s."}</span></div><div class="research-actions">${linkPage("hedge","Read Sunday’s decision")}${linkPage("analysts","Read the seven reports")}${linkPage("gdelt","Open the GDELT study")}</div></div>` +
    archiveWarning() + freshnessBanner() +
    `<div class="overview-grid">${stressPanel()}${exposureCard()}${performancePanel()}${intelligenceCard()}</div>` +
    `<div class="journal-shortcut"><span><b>Decision journal</b> · ${journal.length} recorded · ${journal.filter(row=>!row.outcome).length} awaiting a mark</span>${linkPage("journal","Review outcomes")}</div>` +
    `<div class="origin-note">${esc(d.snapshot_note || (closing?"The paper portfolio is valued at recorded IBKR closing prices.":"Position and returns use the paper ledger’s latest recorded marks."))}</div>`;
}

const quality = d.freshness?.rows || [];
const warnings = quality.filter(row => !["Current", "Replay close", "Reference", "Dated"].includes(row
  .status));
const journal = d.history || [];
// Choose a calendar-date or timestamp format to match the source.
const prettyDate = value => !value ? "—" : /^\d{4}-\d{2}-\d{2}$/.test(value) ? calendarDay(value) : et(
  value);

// Determine whether the saved market observations need an age warning.
function archiveWarning() {
  const now = Date.now(),
    f = d.freshness;
  if (!sample && f && (closing ? now >= Date.parse(f.next_open) : now - Date.parse(d.as_of) > f
      .max_quote_age_seconds * 1000))
    return '<p class="notice"><b>Archived prices.</b> This snapshot is dated ' + esc(calendarDay(f
      .session)) + '. ' + (closing ? 'A newer NYSE session has opened.' :
      'The live quote age limit has elapsed.') + '</p>';
  return "";
}

// Summarize source-date issues and link to the detailed evidence dates.
function freshnessBanner() {
  if (!quality.length) return '<div class="warning-strip">Source dates unavailable. ' + linkPage(
    "freshness", "Inspect inputs") + '</div>';
  const note = warnings.length ? warnings.slice(0, 2).map(row => (row.group === "GDELT" ?
      "GDELT news cohort" : row.name) + " · " + row.status.toLowerCase() + (row.observed ? " (" +
      prettyDate(row.observed) + ")" : "")).join(" / ") :
    "GDELT news through noon Eastern on November 22. All seven analyst reports verified.";
  return '<div class="' + (warnings.length ? "warning-strip" : "quality-summary") +
    '"><span><b>Sunday decision input freshness</b> &nbsp;' + esc(note) +
    (warnings.length > 2 ? " · " + (warnings.length - 2) + " more" : "") + '</span>' + linkPage(
      "freshness", "See source dates") + '</div>';
}

// Group decision inputs by source and display their recorded dates and status.
function freshnessPage() {
  const grouped = [...new Set(quality.map(row => row.group))];
  return title("Source dates & freshness",
      "Sunday, November 22 research. The worker verified the inputs at 7:48 p.m. Eastern. The price table uses Friday’s completed regular session."
      ) +
    archiveWarning() + (d.market.price_mode === "last_close_rehearsal" ?
      '<p class="notice">IBKR regular-session closing prices for ' + esc(d.market.session_date) +
      '. Each instrument has a market timestamp and a separate retrieval time.</p>' : "") +
    grouped.map(group => panel('<h2>' + esc(group) + '</h2>' + table(["Source", "Status",
        "Information / market time", "Issued / received", "Forecast through", "Assessment"
      ],
      quality.filter(row => row.group === group).map(row => [row.name, row.status, prettyDate(row
        .observed), prettyDate(row.received), prettyDate(row.horizon), row.reason])))).join("") +
    (quality.length ? "" : panel('<p class="empty">The saved run has no dated evidence ledger.</p>'));
}

// Summarize past hedge decisions and the outcomes available for comparison.
function journalPage() {
  const scored = journal.filter(row => row.outcome);
  const helped = scored.filter(row => row.outcome.result === "Helped").length,
    cost = scored.filter(row => row.outcome.result === "Cost").length;
  return title("Decision journal",
      "The forward record pairs each timestamped Astra decision with market observations collected after it was recorded. A subsequent review can use only the entries and marks available at its own cutoff."
      ) +
    (d.history_as_of ? '<p class="note">Journal as of ' + esc(et(d.history_as_of)) + '</p>' : "") +
    stats(["Decisions", journal.length, "Recorded Astra reviews"], ["Pending forward outcome", journal
      .length - scored.length, "First post-decision mark, then a later session"
    ], ["Outcome vs keeping the hedge", helped + " helped / " + cost + " cost", (scored.length -
      helped - cost) + " neutral"]) +
    (journal.length ? journal.map(row => {
      const o = row.outcome,
        start = row.study_start;
      return panel('<div class="row"><h2>' + esc(calendarDay(row.session)) + ' · ' + esc(row
        .action) + '</h2><span class="state ' + (o ? "ok" : "info") + '">' + esc(o ? o.result +
          " vs prior position" : "Pending outcome") + '</span></div>' +
        '<p class="note">' + esc(row.basis) + ' · ' + esc(row.contract) + ' · ' + esc(positionName(
          row.previous)) + ' → ' + esc(positionName(row.target)) + ' · ' + esc(row.time ? et(row
          .time) : "Decision time unavailable") + '</p>' +
        '<p class="measure">' + esc(row.rationale) + '</p>' +
        (o ? table(["Forward entry", "Entry observed", "Follow-up", "Follow-up observed",
            "Versus keeping position", "Versus zero futures"
          ], [
            [num(start.price, 2), prettyDate(start.observed), num(o.exit_mark, 2), prettyDate(o
              .observed), signedMoney(Number(o.versus_keep_usd)), signedMoney(Number(o
              .versus_unhedged_usd))]
          ]) :
          '<p class="note">Reference ' + esc(num(row.reference_price, 2)) +
          ' points · change fee ' + money(row.fee_usd, 2) + '. ' + (start ? 'Forward entry ' + esc(
              num(start.price, 2)) + ' points at ' + esc(prettyDate(start.observed)) +
            '. Awaiting a later session.' : 'Awaiting the first eligible post-decision mark.') +
          '</p>') +
        (o?.alternatives ? details("Other targets available at the decision", table(["MES target",
            "Forward P&L vs keeping position"
          ],
          Object.entries(o.alternatives).map(([key, value]) => [signed(Number(key)),
            signedMoney(Number(value))
          ]))) : "") +
        details("Decision record", memo("Response", row.id) + (row.model ? memo("Model", row
            .model) : "") + (row.prompt_sha256 ? memo("Prompt SHA-256", row.prompt_sha256) : "") +
          memo("Analyst batch", row.analyst_run) + memo("GDELT study", row.gdelt_run_id) +
          (row.countercase ? memo("Countercase recorded at decision", row.countercase) : "") + (row
            .reconsider_if ? memo("Reconsider if", row.reconsider_if) : "") +
          (o ? memo("Follow-up source", o.mark_basis + " · received " + prettyDate(o.available)) :
            "")));
    }).join("") : panel('<p class="empty">This snapshot contains no archived Astra decisions.</p>')) +
    panel(
      '<h2>How decisions are scored</h2><p class="note">Both scoring prices must follow the recorded decision. The first eligible IBKR observation sets the study entry. The first observation in a later session on the same expiry sets the exit. The comparison includes the modeled change fee; study marks do not guarantee a fill. Keeping the previous position measures the decision to change it. Zero futures measures the full overlay. Live advisory studies are hypothetical. The Portfolio view uses recorded paper marks and fills. Historical analog returns and stress scenarios are excluded from the forward record.</p>'
      );
}

const pages = {
  overview: overviewPage,
  journal: journalPage,
  freshness: freshnessPage,
  map: mapPage,
  // Open the latest analyst packet published for the desk.
  analysts: () => analystPage(latestAnalysts),
  // Open the analyst packet used for this particular hedge decision.
  "analysts-decision": () => analystPage(d),
  // Open the latest GDELT study available on the desk.
  gdelt: () => gdeltPage(latestStudy),
  // Open the GDELT study used for this particular hedge decision.
  "gdelt-decision": () => gdeltPage(g),
  hedge: hedgePage,
  portfolio: bookPage,
};

// Render the selected desk section and keep its navigation state in sync.
function show(key, scroll) {
  if (!Object.hasOwn(pages, key)) key = "overview";
  const navKey = key === "gdelt-decision" ? "gdelt" : key === "analysts-decision" ? "analysts" : key;
  for (let b of document.querySelectorAll("nav button")) {
    b.classList.toggle("on", b.dataset.page === navKey);
    if (b.dataset.page === navKey) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  }
  v.innerHTML = pages[key]();
  if (navKey === "analysts") showReceipt();
  if (scroll) window.scrollTo(0, 0);
}
document.querySelector("nav").innerHTML = Object.entries(navGroups).map(([title, tabs]) =>
  '<span class="nav-group">' + title + '</span>' + Object.entries(tabs).map(([key, name]) =>
    '<button data-page="' + key + '">' + name + '</button>').join("")).join("");
document.querySelector("#mode").textContent = sample || control ? "Scripted paper example" : closing ?
  "Portfolio hedge review" : "Market-hours advisory";
document.querySelector("#asof").textContent = d.snapshot_asof_label || "Review as of " + et(d.as_of);
const sessionsLink = document.querySelector("#worker-files");
if (sample || control || !d.links?.workerSessions) sessionsLink.remove();
else sessionsLink.href = d.links.workerSessions;
document.querySelector("#largeMap").src = mapSrc;
// Handle desk buttons for navigation, display choices, and evidence inspection.
document.addEventListener("click", (e) => {
  const el = e.target.closest("button");
  if (!el) return;
  if (el.dataset.page) {
    location.hash = el.dataset.page;
    show(el.dataset.page, true);
  }
  if (el.dataset.switch) {
    if (["difference", "totals"].includes(el.dataset.switch)) compareMode = el.dataset.switch;
    else performanceMode = el.dataset.switch;
    show("overview", false);
  }
  if (el.dataset.stock) {
    stock = el.dataset.stock;
    show(location.hash === "#analysts-decision" ? "analysts-decision" : "analysts", false);
  }
  if (el.id === "open-gdelt") {
    const dialog = document.querySelector("#gdelt-dialog");
    dialog.querySelector("iframe").srcdoc = g.producer_page;
    dialog.showModal();
  }
  if (el.id === "expand") document.querySelector("#mapdialog").showModal();
});
// Refresh the selected evidence or verify the packet chosen in the file picker.
document.addEventListener("change", async (e) => {
  let el = e.target;
  if (el.id === "datepick" || el.id === "group") {
    const key = location.hash.slice(1);
    if (el.id === "datepick") selectedDates.set((key === "gdelt-decision" ? g : latestStudy).run,
      el.value);
    else group = el.value;
    show(key, false);
  }
  if (el.id === "inspectSymbol") {
    inspectSymbol = el.value;
    showReceipt();
  }
  if (el.id === "realPacket" && el.files.length) {
    const r = receiptData;
    inspected = null;
    packetError = "";
    try {
      const packet = await inspectPacket(el.files[0], r);
      if (r !== receiptData) return;
      inspected = packet;
      inspectSymbol = "AAPL";
    } catch (err) {
      if (r !== receiptData) return;
      packetError = err.message;
    }
    showReceipt();
  }
  if (el.id === "receipt" && el.files.length) {
    inspected = null;
    packetError = "";
    try {
      if (el.files[0].size > 2e6) throw Error("Receipt too large");
      let r = JSON.parse(await el.files[0].text());
      if (
        !r.run_id ||
        !r.session_date ||
        !r.status ||
        !r.subjects ||
        !Object.values(r.subjects).every((x) => typeof x?.status === "string")
      )
        throw Error("Expected dated producer status.json");
      receiptData = r;
    } catch (err) {
      receiptData = {
        error: err.message
      };
    }
    showReceipt();
  }
});
// Display the section named in the browser's updated URL fragment.
window.addEventListener("hashchange", () => show(location.hash.slice(1), true));
show(location.hash.slice(1) || "overview", false);
</script>
</body>

</html>
